[package]
name = "domain-status-cli"
version = "0.2.0"
edition = "2021"
description = "CLI definition for domain-status (single source of truth for completions and man page)"
license = "MIT"
repository = "https://github.com/alexwoolford/domain-status"
homepage = "https://github.com/alexwoolford/domain-status"
documentation = "https://docs.rs/domain-status"
publish = true

[lib]
name = "domain_status_cli"

[dependencies]
clap = { version = "^4.6", features = ["derive", "env"] }
clap-verbosity-flag = "^3.0"
