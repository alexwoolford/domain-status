name: Release

on:
  push:
    tags:
      - 'v*'  # Triggers on version tags like v0.1.0

env:
  CARGO_TERM_COLOR: always

jobs:
  build-release:
    name: Build Release Binaries
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            asset_name: domain-status-linux-x86_64
          - os: macos-latest
            target: x86_64-apple-darwin
            asset_name: domain-status-macos-x86_64
          - os: macos-latest
            target: aarch64-apple-darwin
            asset_name: domain-status-macos-aarch64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            asset_name: domain-status-windows-x86_64.exe

    steps:
      - uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
          components: rustfmt, clippy

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: '.'
          cache-on-failure: true

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }} --locked
        env:
          # For macOS cross-compilation
          MACOSX_DEPLOYMENT_TARGET: "10.13"

      - name: Strip binary (Unix)
        if: matrix.os != 'windows-latest'
        run: strip target/${{ matrix.target }}/release/domain-status
        continue-on-error: true  # strip might not be available on all systems

      - name: Create release archive (Unix)
        if: matrix.os != 'windows-latest'
        run: |
          cd target/${{ matrix.target }}/release
          tar czf ${{ github.workspace }}/${{ matrix.asset_name }}.tar.gz domain-status
          cd ${{ github.workspace }}

      - name: Create release archive (Windows)
        if: matrix.os == 'windows-latest'
        shell: powershell
        run: |
          $workspace = "${{ github.workspace }}"
          Compress-Archive -Path target/${{ matrix.target }}/release/domain-status.exe -DestinationPath "$workspace/${{ matrix.asset_name }}.zip" -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: |
            ${{ matrix.asset_name }}.tar.gz
            ${{ matrix.asset_name }}.zip
          if-no-files-found: error
          retention-days: 30

  create-release:
    name: Create GitHub Release
    needs: build-release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0  # Full history for changelog generation

      - name: Get version from tag
        id: tag
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./artifacts

      - name: Create release notes
        id: release_notes
        run: |
          # Extract changelog section for this version
          VERSION="${{ steps.tag.outputs.VERSION }}"
          # Get changelog content for this version (between [VERSION] and next version or Unreleased)
          awk "/^## \[$VERSION\]/,/^## \[/" CHANGELOG.md | head -n -1 > release_notes.txt || \
          awk "/^## \[$VERSION\]/,/^## \[Unreleased\]/" CHANGELOG.md | head -n -1 > release_notes.txt || \
          echo "Release $VERSION" > release_notes.txt
          cat release_notes.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          body_path: release_notes.txt
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-crates-io:
    name: Publish to crates.io
    needs: create-release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      # Skip versions already on the index so tag re-runs stay green after a
      # successful publish (crates.io forbids the same version twice).
      - name: Publish crates to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          set -euo pipefail
          crate_http_code() {
            local pkg="$1" version="$2"
            curl -sS -o /tmp/crates-io-"${pkg}".json -w "%{http_code}" \
              -A "domain-status-release-ci (https://github.com/alexwoolford/domain-status)" \
              "https://crates.io/api/v1/crates/${pkg}/${version}"
          }
          PUBLISH_RESULT=skip
          publish_if_needed() {
            local pkg="$1" version code
            PUBLISH_RESULT=skip
            version="$(cargo metadata --format-version 1 --no-deps --offline --frozen \
              | jq -r --arg pkg "$pkg" '.packages[] | select(.name == $pkg) | .version')"
            if [[ -z "$version" || "$version" == "null" ]]; then
              echo "::error::Could not determine version for ${pkg}"
              return 1
            fi
            code="$(crate_http_code "$pkg" "$version")"
            if [[ "$code" == "200" ]]; then
              echo "${pkg}@${version} already on crates.io; skipping"
              return 0
            fi
            if [[ "$code" != "404" ]]; then
              echo "::error::Unexpected crates.io response for ${pkg}@${version}: HTTP ${code}"
              cat /tmp/crates-io-"${pkg}".json || true
              return 1
            fi
            echo "Publishing ${pkg}@${version}"
            if cargo publish -p "$pkg" --locked; then
              PUBLISH_RESULT=published
              return 0
            fi
            echo "::error::cargo publish failed for ${pkg}@${version}. If this is 403, replace the CARGO_REGISTRY_TOKEN secret with a crates.io token that has publish-update for both domain-status and domain-status-cli."
            code="$(crate_http_code "$pkg" "$version")"
            if [[ "$code" == "200" ]]; then
              echo "${pkg}@${version} is on crates.io after the failed publish; treating as success"
              return 0
            fi
            return 1
          }
          publish_if_needed domain-status-cli
          if [[ "$PUBLISH_RESULT" == "published" ]]; then
            echo "Waiting for crates.io index to pick up domain-status-cli"
            sleep 30
          fi
          publish_if_needed domain-status

  update-homebrew:
    name: Update Homebrew Tap
    needs: create-release
    runs-on: ubuntu-latest
    steps:
      - name: Get version from tag
        id: tag
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Wait for release assets to be available
        run: sleep 30

      - name: Download release archives and compute SHA256
        id: sha
        run: |
          VERSION="${{ steps.tag.outputs.VERSION }}"
          BASE="https://github.com/alexwoolford/domain-status/releases/download/v${VERSION}"

          curl -sL "${BASE}/domain-status-macos-aarch64.tar.gz" -o macos-aarch64.tar.gz
          curl -sL "${BASE}/domain-status-macos-x86_64.tar.gz" -o macos-x86_64.tar.gz
          curl -sL "${BASE}/domain-status-linux-x86_64.tar.gz" -o linux-x86_64.tar.gz

          echo "SHA_MACOS_ARM=$(sha256sum macos-aarch64.tar.gz | cut -d' ' -f1)" >> $GITHUB_OUTPUT
          echo "SHA_MACOS_X86=$(sha256sum macos-x86_64.tar.gz | cut -d' ' -f1)" >> $GITHUB_OUTPUT
          echo "SHA_LINUX_X86=$(sha256sum linux-x86_64.tar.gz | cut -d' ' -f1)" >> $GITHUB_OUTPUT

      - name: Checkout Homebrew tap
        uses: actions/checkout@v6
        with:
          repository: alexwoolford/homebrew-domain-status
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: homebrew-tap

      - name: Update formula
        run: |
          VERSION="${{ steps.tag.outputs.VERSION }}"
          cat > homebrew-tap/Formula/domain-status.rb << FORMULA
          class DomainStatus < Formula
            desc "Concurrent URL status checker that captures comprehensive metadata in SQLite"
            homepage "https://github.com/alexwoolford/domain-status"
            version "${VERSION}"
            license "MIT"

            on_macos do
              if Hardware::CPU.arm?
                url "https://github.com/alexwoolford/domain-status/releases/download/v${VERSION}/domain-status-macos-aarch64.tar.gz"
                sha256 "${{ steps.sha.outputs.SHA_MACOS_ARM }}"
              else
                url "https://github.com/alexwoolford/domain-status/releases/download/v${VERSION}/domain-status-macos-x86_64.tar.gz"
                sha256 "${{ steps.sha.outputs.SHA_MACOS_X86 }}"
              end
            end

            on_linux do
              url "https://github.com/alexwoolford/domain-status/releases/download/v${VERSION}/domain-status-linux-x86_64.tar.gz"
              sha256 "${{ steps.sha.outputs.SHA_LINUX_X86 }}"
            end

            def install
              bin.install "domain-status"
              bin.install_symlink "domain-status" => "domain_status"
            end

            test do
              assert_match "domain-status", shell_output("\#{bin}/domain-status --version")
            end
          end
          FORMULA
          mkdir -p homebrew-tap/Aliases
          echo "domain-status" > homebrew-tap/Aliases/domain_status
          rm -f homebrew-tap/Formula/domain_status.rb

      - name: Commit and push formula update
        run: |
          cd homebrew-tap
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/domain-status.rb Aliases/domain_status
          git add -u Formula/domain_status.rb || true
          git commit -m "Update domain-status to v${{ steps.tag.outputs.VERSION }}"
          git push
